<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="page web" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Landing Page - Amanzing Web Page</title>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-logo">Amazing Web Page</div>
        </div>
        <div class="header-right">
            <ul>
                <li>Info A</li>
                <li>Info B</li>
                <li>Info C</li>
            </ul>
        </div>
    </div>

    <div class="intro">
        <div class="intro-left">
             <h1 class="title-left">This website is awesome</h1>
             <p class="sub-text-left">Subtext for the intro section about the website in general. More information about website</p>
             <div class="intro-button">
                 <button class="intro-click-button">Click here</button>
             </div>
        </div>
        <div class="intro-right-image">
            <img class="intro-image" src=".src/images/1.png" alt="Image 1">
        </div>
    </div>

    <div class="gallery-section">
        <div class="gallery-container">
            <div class="gallery-item">imagen 1</div>
            <div class="gallery-item">imagen 2</div>
            <div class="gallery-item">imagen 3</div>
            <div class="gallery-item">imagen 4</div>
        </div>
    </div>

    <div class="text-phrases">
        <div class="intro-phrases>
             <h1 class="title-phrases">Giant text</h1>
        </div>
    </div>
    
    <div class="banner-action">
        <div class="banner-text>
             <h1 class="title-banner">Giant text</h1>
             <div class="banner-button">
                 <button class="intro-click-button">sign up here</button>
            </div>
        </div>
    </div>

    <div class="footer-paragraph">
        <p>PARRAFOOOOOO</p>
    </div>
</body>
</html>
